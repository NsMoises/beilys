services:
  - type: web
    name: whatsapp-bot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: PREFIX
        value: "!"
      - key: BOT_NAME
        value: MiBotWhatsApp
      - key: API_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: whatsapp-bot
